org: tobiastac
service: foodiary-api

provider:
  name: aws
  region: sa-east-1
  runtime: nodejs24.x
  memorySize: 128
  architecture: arm64
  stage: ${opt:stage, 'dev'}
  environment: ${file(./sls/config/env.yml)}

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.mjs

functions:
  - ${file(./sls/functions/auth.yml)}

resources:
  - ${file(./sls/resources/UserPool.yml)}
